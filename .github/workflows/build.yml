name: Build Matrix

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.project }} for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Each project defines its own target list and build recipe.
        include:
          # --- csqtt: Rust project ---
          - project: csqtt
            language: rust
            repo_url: https://github.com/amurcanov/csqtt.git
            source_path: rust-server
            artifact_name: csqtt
            binary_name: csqtt-rust-server
            target: x86_64-unknown-linux-gnu
            build_command: cargo build --release --target ${{ matrix.target }}
            artifact_path: target/${{ matrix.target }}/release/csqtt-rust-server

          - project: csqtt
            language: rust
            repo_url: https://github.com/amurcanov/csqtt.git
            source_path: rust-server
            artifact_name: csqtt
            binary_name: csqtt-rust-server
            target: aarch64-unknown-linux-musl
            build_command: cargo build --release --target ${{ matrix.target }}
            artifact_path: target/${{ matrix.target }}/release/csqtt-rust-server

          # --- OpenFlux: Go project ---
          - project: OpenFlux
            language: go
            go_version: '1.22'
            repo_url: https://github.com/p1neappleXpress/OpenFlux.git
            source_path: .
            artifact_name: OpenFlux
            binary_name: universal-bypass-tool
            target: amd64
            build_command: |
              go mod tidy
              go build -o universal-bypass-tool .
            artifact_path: universal-bypass-tool

          - project: OpenFlux
            language: go
            go_version: '1.22'
            repo_url: https://github.com/p1neappleXpress/OpenFlux.git
            source_path: .
            artifact_name: OpenFlux
            binary_name: universal-bypass-tool
            target: arm64
            build_command: |
              go mod tidy
              go build -o universal-bypass-tool .
            artifact_path: universal-bypass-tool

          # --- olcrtc: Go project ---
          - project: olcrtc
            language: go
            go_version: '1.26'
            repo_url: https://github.com/openlibrecommunity/olcrtc.git
            source_path: .
            artifact_name: olcrtc
            binary_name: olcrtc
            target: amd64
            build_command: |
              go mod download
              go build -trimpath -ldflags='-s -w' -o olcrtc ./cmd/olcrtc
            artifact_path: olcrtc

          - project: olcrtc
            language: go
            go_version: '1.26'
            repo_url: https://github.com/openlibrecommunity/olcrtc.git
            source_path: .
            artifact_name: olcrtc
            binary_name: olcrtc
            target: arm64
            build_command: |
              go mod download
              go build -trimpath -ldflags='-s -w' -o olcrtc ./cmd/olcrtc
            artifact_path: olcrtc

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ---------- Language setup ----------
      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}

      - name: Install musl tools (for musl Rust targets)
        if: matrix.language == 'rust' && contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # ---------- Clone target repository ----------
      - name: Clone ${{ matrix.project }}
        run: |
          git clone --depth 1 "${{ matrix.repo_url }}" source-code

      # ---------- Build ----------
      - name: Build ${{ matrix.project }} for ${{ matrix.target }}
        working-directory: source-code/${{ matrix.source_path }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: ${{ matrix.build_command }}

      # ---------- Collect artifact ----------
      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp "source-code/${{ matrix.source_path }}/${{ matrix.artifact_path }}" \
             "artifacts/${{ matrix.binary_name }}-linux-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-linux-${{ matrix.target }}
          path: artifacts/
          retention-days: 30
