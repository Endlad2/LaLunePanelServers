name: Build Matrix

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.project }} (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- csqtt: Rust project (binary name = package name "csqtt") ---
          - project: csqtt
            language: rust
            repo_url: https://github.com/amurcanov/csqtt.git
            source_path: rust-server
            artifact_name: csqtt
            binary_name: csqtt
            target: x86_64-unknown-linux-gnu

          # --- OpenFlux: Go project ---
          - project: OpenFlux
            language: go
            go_version: '1.22'
            repo_url: https://github.com/p1neappleXpress/OpenFlux.git
            source_path: .
            artifact_name: OpenFlux
            binary_name: universal-bypass-tool
            target: amd64

          - project: OpenFlux
            language: go
            go_version: '1.22'
            repo_url: https://github.com/p1neappleXpress/OpenFlux.git
            source_path: .
            artifact_name: OpenFlux
            binary_name: universal-bypass-tool
            target: arm64

          # --- olcrtc: Go project ---
          - project: olcrtc
            language: go
            go_version: '1.26'
            repo_url: https://github.com/openlibrecommunity/olcrtc.git
            source_path: .
            artifact_name: olcrtc
            binary_name: olcrtc
            target: amd64

          - project: olcrtc
            language: go
            go_version: '1.26'
            repo_url: https://github.com/openlibrecommunity/olcrtc.git
            source_path: .
            artifact_name: olcrtc
            binary_name: olcrtc
            target: arm64

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      # ---------- Language setup ----------
      - name: Setup Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go_version }}

      # ---------- Clone target repository ----------
      - name: Clone ${{ matrix.project }}
        run: git clone --depth 1 "${{ matrix.repo_url }}" source-code

      # ---------- Build Rust ----------
      - name: Build (Rust)
        if: matrix.language == 'rust'
        working-directory: source-code/${{ matrix.source_path }}
        run: cargo build --release --target ${{ matrix.target }}

      # ---------- Build Go ----------
      - name: Build (Go)
        if: matrix.language == 'go'
        working-directory: source-code/${{ matrix.source_path }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.target }}
          CGO_ENABLED: '0'
        run: |
          if [ "${{ matrix.project }}" = "OpenFlux" ]; then
            go mod tidy
            go build -o universal-bypass-tool .
          else
            go mod download
            go build -trimpath -ldflags='-s -w' -o olcrtc ./cmd/olcrtc
          fi

      # ---------- Collect artifact (Rust): find the real binary name ----------
      - name: Collect artifact (Rust)
        if: matrix.language == 'rust'
        run: |
          mkdir -p artifacts
          BIN="source-code/${{ matrix.source_path }}/target/${{ matrix.target }}/release/${{ matrix.binary_name }}"
          if [ ! -f "$BIN" ]; then
            echo "Binary '${{ matrix.binary_name }}' not found, searching release dir..."
            ls -la "source-code/${{ matrix.source_path }}/target/${{ matrix.target }}/release/"
            BIN=$(find "source-code/${{ matrix.source_path }}/target/${{ matrix.target }}/release/" \
                  -maxdepth 1 -type f -executable ! -name '*.d' \
                  ! -name '*.rlib' ! -name '*.so' | head -n 1)
          fi
          echo "Using binary: $BIN"
          cp "$BIN" "artifacts/${{ matrix.artifact_name }}-linux-${{ matrix.target }}"

      # ---------- Collect artifact (Go) ----------
      - name: Collect artifact (Go)
        if: matrix.language == 'go'
        run: |
          mkdir -p artifacts
          cp "source-code/${{ matrix.source_path }}/${{ matrix.binary_name }}" \
             "artifacts/${{ matrix.artifact_name }}-linux-${{ matrix.target }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-linux-${{ matrix.target }}
          path: artifacts/
          retention-days: 30
